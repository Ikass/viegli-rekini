en:
  landing:
    show:
      meta_title: "ViegliRēķini — invoices in three steps"
      meta_description: "Create a correct invoice in three steps. VAT, numbering and the e-invoice format are handled for you. Made in Latvia."

      top_strip: "Made in Latvia, for people who send their own invoices."

      nav:
        how_it_works: "How it works"
        pricing: "Pricing"
        questions: "Questions"
        log_in: "Log in"
        create_first_invoice: "Create your first invoice"

      hero:
        title: "Invoices in three steps. Legal in Latvia."
        subtitle: "Choose the customer, add what you sold, send it. The app handles VAT, numbering and the e-invoice format."
        cta: "Create your first invoice"
        reassurance: "No credit card. Nothing to install."
        screens_label: "Three app screens: choose a customer, add items, send the invoice"

      steps:
        one:
          label: "New invoice, customer"
          caption_lead: "Pick"
          caption_rest: "your customer."
          screen:
            input: "Silva"
            saved_name: "Silva Studio SIA"
            saved_tag: "Saved customer"
            other: "Silva Koks SIA"
            add_new: "+ Add a new customer"
            hint: "Address, registration number and VAT number fill in from the saved customer."
        two:
          label: "New invoice, items"
          caption_lead: "Add"
          caption_rest: "what you sold."
          screen:
            items:
              - name: "Frame, oak, 40×50 cm"
                qty: "1 × €48.00"
                total: "€48.00"
              - name: "Glass, cut to size"
                qty: "1 × €12.00"
                total: "€12.00"
            add_from_saved: "+ Add from saved items"
            subtotal_label: "Subtotal"
            subtotal: "€60.00"
            vat_label: "VAT 21%"
            vat: "€12.60"
            total_label: "Total"
            total: "€72.60"
        three:
          label: "Review and send"
          caption_lead: "Send"
          caption_rest: "it when it looks right. Nothing goes out before that."
          screen:
            invoice_label: "Invoice No. 0001"
            total: "Total €72.60"
            customer: "Silva Studio SIA"
            standard: "Meets the e-invoice standard"
            send: "Send invoice"
            pdf: "PDF"
            xml: "XML"

      contrast:
        title: "Most invoicing tools are made for accountants. You probably aren't one."
        body: "They come with ledgers, plans and menus you'll never open. You just want to send an invoice and get paid."
        emphasis: "ViegliRēķini does one job: it gets a correct invoice to your customer. The rest can come later."

      founder:
        title: "Hi, I'm Reinis."
        para_1: "My wife sends the invoices for her parents' picture-framing business. On a family holiday she had to send one from her phone, in the latvija.lv portal. The portal wasn't built for phones and it's confusing to use, so it took her at least half an hour."
        para_2: "That was one invoice, and it should have taken a couple of minutes. Instead she lost part of her holiday and got stressed. That's when I decided people need something easier, simpler and faster."
        para_3: "I'm building it step by step, starting with the basic job done properly. If something confuses you, write to me. I read every message."
        signature: "Reinis,"
        email: "reinis@grittypublishing.com"
        photo_alt: "Photo of Reinis"

      features:
        heading: "What it does."
        intro: "A short list, on purpose."
        cards:
          home_screen:
            menu:
              new_invoice: "New invoice"
              customers_and_items: "Customers and items"
              my_invoices: "My invoices"
            title: "Three things on your home screen"
            body: "New invoice is the biggest button. The other two take you to your customers and items, and to your past invoices."
          saved:
            pills:
              - "Silva Studio SIA"
              - "Frame, oak"
              - "Glass, cut to size"
              - "Koks SIA"
            title: "Saved customers and items"
            body: "Enter them once. Next time it takes two clicks."
          numbering:
            numbers: ["0001", "0002", "0003", "0004"]
            title: "Invoice numbers don't skip or repeat"
            body: "Numbering is locked in the database, so you can't end up with a gap or a duplicate."
          check:
            standard: "Meets the e-invoice standard"
            title: "A check mark when it's correct"
            body: "It shows up when the invoice meets the e-invoice standard."
          pdf_xml:
            title: "A PDF and an e-invoice"
            body: "Every invoice comes as a PDF you can print and as a standard XML e-invoice."
          saved_invoices:
            rows:
              - label: "0003 · Silva Studio SIA"
                amount: "€72.60"
              - label: "0002 · Koks SIA"
                amount: "€140.00"
              - label: "0001 · Silva Studio SIA"
                amount: "€36.30"
            title: "Every invoice stays saved"
            body: "All your invoices sit in one list, so an old one is quick to find."

      law:
        heading: "Built around Latvian law."
        intro: "You don't need to know the rules. The app does."
        columns:
          fields:
            title: "Required fields"
            body: "Each invoice has the details the Accounting Law requires."
          vat:
            title: "VAT rules"
            body: "VAT is calculated line by line, and the totals add up."
          e_invoice:
            title: "E-invoice format"
            body: "Standard XML (PEPPOL BIS Billing 3.0, EN 16931), which your customers' systems can read."

      pricing:
        heading: "Pay for each invoice you send."
        intro: "There's no plan to choose. Try a few invoices first."
        card:
          label: "Per invoice"
          price: "[€0.00]"
          unit: "per invoice sent, [excl. VAT]"
          features:
            - "[N] free invoices to try"
            - "A PDF and an XML e-invoice with each one"
            - "No monthly fee"
        cta: "Create your first invoice"

      faq:
        heading: "Questions"
        intro: "Including what it can't do yet."
        groups:
          getting_started:
            label: "Getting started"
            items:
              - question: "Do I need an accountant to start?"
                answer: "No. Enter your company details once, then create your first invoice."
              - question: "Do I need a credit card to try it?"
                answer: "No. The free invoices don't need payment details. [Confirm what happens when they run out.]"
              - question: "What does it cost?"
                answer: "You pay for each invoice you send. The details are in the pricing section above."
          capabilities:
            label: "What it can and cannot do yet"
            items:
              - question: "Does it make e-invoices?"
                answer: "Yes. Each invoice comes as a PDF and as a standard XML e-invoice. [Describe how the invoice reaches the customer at launch.]"
              - question: "What can't it do yet?"
                answer:
                  - "Credit notes come soon after launch, then quotes and advance invoices. There's no bank sync and no setup for several shops yet."
                  - "If you need those now, this isn't the right tool yet. I'd rather you hear that before you sign up."
              - question: "Can I bring my customers over from another tool?"
                answer: "Not yet. You add each customer and item the first time you use them, and they're saved after that."
          data:
            label: "Your data"
            items:
              - question: "Where is my data?"
                answer: "[HOSTING LOCATION AND HOW IT IS PROTECTED]"
              - question: "Can I take my invoices with me?"
                answer: "[EXPORT PROMISE YOU CAN KEEP]"

      closing:
        title: "Send your first invoice today."
        body: "No credit card. Nothing to install."
        cta: "Create your first invoice"

      footer:
        made_in: "Built in Latvia"
        company: 'SIA "Gritty Publishing" · Reg. no. 40203365593'
        privacy: "Privacy"
        terms: "Terms"
        contact: "Contact"
