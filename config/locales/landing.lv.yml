        title: "Sveiki, es esmu Reinis."
        para_1: "Mana sieva izraksta rēķinus savu vecāku uzņēmumam, kas nodarbojas ar bilžu ierāmēšanu. Ģimenes atvaļinājumā viņai vajadzēja nosūtīt vienu rēķinu no telefona, latvija.lv portālā. Portāls nav veidots darbam telefonā, un tajā ir viegli apmaldīties, tāpēc viņa pie tā pavadīja vismaz pusstundu."
        para_2: "Tas bija viens rēķins, un tam vajadzēja aizņemt dažas minūtes. Tā vietā viņa pazaudēja daļu atvaļinājuma un nostresojās. Tad es sapratu, ka cilvēkiem vajag kaut ko vieglāku, vienkāršāku un ātrāku."
        para_3: "Es to veidoju pa soļiem, sākot ar pamatdarbu, kas jāizdara pareizi. Ja kaut kas nav skaidrs, uzraksti man. Es izlasu katru ziņu."
        signature: "Reinis,"
        email: "reinis@grittypublishing.com"
        photo_alt: "Reiņa foto"

