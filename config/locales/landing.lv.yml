      faq:
        heading: "Jautājumi"
        intro: "Arī par to, ko tas vēl nespēj."
        groups:
          getting_started:
            label: "Kā sākt"
            items:
              - question: "Vai man vajag grāmatvedi, lai sāktu?"
                answer: "Nē. Vienreiz ievadi sava uzņēmuma datus un izraksti pirmo rēķinu."
              - question: "Vai izmēģināšanai vajag kredītkarti?"
                answer: "Nē. Bezmaksas rēķiniem maksājumu dati nav vajadzīgi. [Precizēt, kas notiek, kad tie beidzas.]"
              - question: "Cik tas maksā?"
                answer: "Tu maksā par katru nosūtīto rēķinu. Sīkāk skaties sadaļā „Cena” augstāk."
          capabilities:
            label: "Ko tas var un ko vēl nevar"
            items:
              - question: "Vai tas izveido e-rēķinus?"
                answer: "Jā. Katrs rēķins ir gan PDF, gan standarta XML e-rēķins. [Aprakstīt, kā rēķins nonāk pie klienta, kad sistēma sāk darboties.]"
              - question: "Ko tas vēl nespēj?"
                answer:
                  - "Kredītrēķini nāks drīz pēc sākuma, tad piedāvājumi un avansa rēķini. Vēl nav bankas sinhronizācijas, un nevar iestatīt vairākus veikalus."
                  - "Ja tev tas vajadzīgs jau tagad, šis rīks tev vēl nederēs. Labāk, lai tu to uzzini pirms reģistrēšanās."
              - question: "Vai varu pārnest klientus no cita rīka?"
                answer: "Pagaidām nē. Katru klientu un preci pievieno pirmo reizi, kad tos izmanto, un pēc tam tie paliek saglabāti."
          data:
            label: "Tavi dati"
            items:
              - question: "Kur glabājas mani dati?"
                answer: "[Datu glabāšanas vieta un aizsardzība]"
              - question: "Vai varu paņemt savus rēķinus līdzi?"
                answer: "[Eksporta solījums, ko vari izpildīt]"

